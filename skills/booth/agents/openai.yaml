interface:
  display_name: "Avatar Closet"
  short_description: "Unofficial: read your BOOTH purchases and wish list, find updated items, and check VRChat avatar compatibility"
  default_prompt: "Use $booth to list the outfits in my BOOTH library that support Shinano."

dependencies:
  tools:
    - type: "mcp"
      value: "booth"
      description: "Bundled read-only BOOTH buyer MCP server (unofficial, not affiliated with pixiv or BOOTH)"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
